/* =========================================================
   =========================================================
   WELCOME CARD & STACK SPACING FIX
   欢迎卡片颜色透明 + 卡片间距修复
   =========================================================
   ========================================================= */

/* ---------- 1. markdown 内部透明，只显示外层卡片 ---------- */

[class*="markdown"],
.markdown-body {
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: none !important;
    border: 0 !important;
}

.markdown,
.markdown-body {
    border-radius: 0 !important;
    padding: 0 !important;
}

/* ---------- 2. body 垂直子元素间距 ---------- */

/* body 里除 nav 外的每个直接块之间都有 12px 间距 */
.body > .nav + * {
    margin-top: 12px !important;
}

.body > * + * {
    margin-top: 12px !important;
}

/* nav 有自己的 margin-top 逻辑 */
.body > .nav {
    margin-top: 74px !important;
    margin-bottom: 0 !important;
}

/* ---------- 3. 欢迎卡片统一风格 ---------- */

/* 除 obj-box / list / toolbar 外的 body 直接子块 = 欢迎卡片 */
.body > div:not(.obj-box):not([class*="list"]):not([class*="toolbar"]) {
    background: rgba(255, 255, 255, 0.45) !important;
    border: 1px solid rgba(255, 255, 255, 0.52) !important;
    border-radius: 14px !important;
    backdrop-filter: blur(22px) saturate(145%) !important;
    -webkit-backdrop-filter: blur(22px) saturate(145%) !important;
    box-shadow: 0 14px 45px rgba(30, 80, 130, 0.10) !important;
    padding: 16px 20px !important;
    margin-left: 8px !important;
    margin-right: 8px !important;
    box-sizing: border-box !important;
    width: auto !important;
    max-width: calc(100% - 16px) !important;
}

.hope-ui-dark
.body > div:not(.obj-box):not([class*="list"]):not([class*="toolbar"]) {
    background: rgba(14, 18, 26, 0.54) !important;
    border-color: rgba(255, 255, 255, 0.08) !important;
    box-shadow: 0 14px 45px rgba(0, 0, 0, 0.30) !important;

    font-size: 18px !important;

    line-height: 1.6 !important;
    color: #54606d !important;

    color: #a4afbc !important;

    opacity: 0.6 !important;
    transition: opacity 0.2s ease !important;

    color: #aeb8c4 !important;

<script>

(function () {

    "use strict";


    /* =====================================================
       Prevent Duplicate Execution
       ===================================================== */

    if (
        window.__OpenListVideoTheme
    ) {

        return;

    }


    window.__OpenListVideoTheme =
        true;


    /* =====================================================
       DOM
       ===================================================== */

    function $(id) {

        return document.getElementById(
            id
        );

    }


    /* =====================================================
       Video
       ===================================================== */

    function initVideo() {

        const lightVideo =
            $("openlist-video-bg-light");

        const darkVideo =
            $("openlist-video-bg-dark");


        if (
            !lightVideo ||
            !darkVideo
        ) {

            return;

        }


        const LIGHT_VIDEO =
            "/d/%E5%AD%A6%E7%94%9F%E7%9B%AE%E5%BD%95/alist%E9%BB%98%E8%AE%A4%E8%83%8C%E6%99%AF/lemon.mp4";


        const DARK_VIDEO =
            "/d/%E5%AD%A6%E7%94%9F%E7%9B%AE%E5%BD%95/alist%E9%BB%98%E8%AE%A4%E8%83%8C%E6%99%AF/wallpaper1.mp4";


        const blobUrls = {
            light: null,
            dark: null
        };


        const blobLoading = {
            light: false,
            dark: false
        };


        function isDarkMode() {

            return document.body.classList.contains(
                "hope-ui-dark"
            );

        }


        function loadBlob(key, url) {

            if (
                blobUrls[key] ||
                blobLoading[key]
            ) {

                return;

            }


            blobLoading[key] =
                true;


            fetch(
                url,
                {
                    credentials:
                        "include"
                }
            )
            .then(
                function (res) {

                    if (!res.ok) {

                        throw new Error(
                            "HTTP " + res.status
                        );

                    }

                    return res.blob();

                }
            )
            .then(
                function (blob) {

                    blobUrls[key] =
                        URL.createObjectURL(
                            blob
                        );

                    blobLoading[key] =
                        false;

                    console.log(
                        "[Video] blob ready:",
                        key,
                        blob.size,
                        "bytes"
                    );


                    const target =
                        key === "dark"
                            ? darkVideo
                            : lightVideo;


                    const isCurrent =
                        key === "dark"
                            ? isDarkMode()
                            : !isDarkMode();


                    if (
                        isCurrent &&
                        target.src !==
                            blobUrls[key]
                    ) {

                        const time =
                            target.currentTime || 0;

                        target.src =
                            blobUrls[key];


                        target.addEventListener(
                            "loadedmetadata",
                            function () {

                                try {

                                    if (
                                        time > 0 &&
                                        time <
                                        target.duration
                                    ) {

                                        target.currentTime =
                                            time;

                                    }

                                } catch (e) {}


                                target.play().catch(
                                    function () {}
                                );

                            },
                            {
                                once: true
                            }
                        );

                    }

                }
            )
            .catch(
                function (err) {

                    blobLoading[key] =
                        false;

                    console.warn(
                        "[Video] blob load failed:",
                        err
                    );

                }
            );

        }


        function applyTheme() {

            const dark =
                isDarkMode();


            const current =
                dark
                    ? darkVideo
                    : lightVideo;


            const other =
                dark
                    ? lightVideo
                    : darkVideo;


            const currentKey =
                dark
                    ? "dark"
                    : "light";


            const otherKey =
                dark
                    ? "light"
                    : "dark";


            const currentUrl =
                dark
                    ? DARK_VIDEO
                    : LIGHT_VIDEO;


            const otherUrl =
                dark
                    ? LIGHT_VIDEO
                    : DARK_VIDEO;


            const targetSrc =
                blobUrls[currentKey] ||
                currentUrl;


            if (
                current.src !== targetSrc
            ) {

                current.preload =
                    "metadata";

                current.src =
                    targetSrc;

            }


            current.classList.add(
                "active"
            );

            other.classList.remove(
                "active"
            );


            current.play().catch(
                function () {}
            );

            other.pause();


            loadBlob(
                currentKey,
                currentUrl
            );


            if (!blobUrls[otherKey]) {

                setTimeout(
                    function () {

                        loadBlob(
                            otherKey,
                            otherUrl
                        );

                    },
                    8000
                );

            }

        }


        applyTheme();


        const observer =
            new MutationObserver(
                function () {

                    applyTheme();

                }
            );


        observer.observe(
            document.body,
            {
                attributes:
                    true,

                attributeFilter:
                    [
                        "class"
                    ]
            }
        );


        observer.observe(
            document.documentElement,
            {
                attributes:
                    true,

                attributeFilter:
                    [
                        "class"
                    ]
            }
        );


        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    const current =
                        isDarkMode()
                            ? darkVideo
                            : lightVideo;


                    current.play().catch(
                        function () {}
                    );

                }

            }
        );

    }

    /* =====================================================
       Scroll Effects
       ===================================================== */

    function initScroll() {

        const topbar =
            $("openlist-topbar");


        const topButton =
            $("openlist-top");


        if (!topbar) {

            return;

        }


        function update() {

            const scroll =
                window.scrollY;


            if (
                scroll > 35
            ) {

                topbar.classList.add(
                    "scrolled"
                );

            } else {

                topbar.classList.remove(
                    "scrolled"
                );

            }


            if (
                topButton
            ) {

                if (
                    scroll > 300
                ) {

                    topButton.classList.add(
                        "show"
                    );

                } else {

                    topButton.classList.remove(
                        "show"
                    );

                }

            }

        }


        window.addEventListener(
            "scroll",
            update,
            {
                passive:
                    true
            }
        );


        update();

    }


    /* =====================================================
       Back to Top
       ===================================================== */

    function initTop() {

        const top =
            $("openlist-top");


        const footerTop =
            $("openlist-footer-top");


        function scrollTop() {

            window.scrollTo({

                top:
                    0,

                behavior:
                    "smooth"

            });

        }


        if (top) {

            top.addEventListener(
                "click",
                scrollTop
            );

        }


        if (footerTop) {

            footerTop.addEventListener(
                "click",
                scrollTop
            );

        }

    }


    /* =====================================================
       Search
       ===================================================== */

    function initSearch() {

        const button =
            $("openlist-search-button");


        const panel =
            $("openlist-search-panel");


        const input =
            $("openlist-search-input");


        if (
            !button ||
            !panel ||
            !input
        ) {

            return;

        }


        function openSearch() {

            panel.classList.add(
                "open"
            );


            setTimeout(
                function () {

                    input.focus();

                },
                80
            );

        }


        function closeSearch() {

            panel.classList.remove(
                "open"
            );

        }


        button.addEventListener(
            "click",
            function () {

                if (
                    panel.classList.contains(
                        "open"
                    )
                ) {

                    closeSearch();

                } else {

                    openSearch();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeSearch();

                    return;

                }


                if (
                    event.key ===
                    "Enter"
                ) {

                    const keyword =
                        input.value.trim();


                    if (!keyword) {

                        return;

                    }


                    const inputs =
                        document.querySelectorAll(
                            "input"
                        );


                    let target =
                        null;


                    for (
                        let i = 0;
                        i < inputs.length;
                        i++
                    ) {

                        const candidate =
                            inputs[i];


                        if (
                            candidate ===
                            input
                        ) {

                            continue;

                        }


                        const placeholder =
                            (
                                candidate
                                    .placeholder ||
                                ""
                            ).toLowerCase();


                        if (

                            placeholder.includes(
                                "search"
                            ) ||

                            placeholder.includes(
                                "\u641C\u7D22"
                            )
                        ) {

                            target =
                                candidate;

                            break;

                        }

                    }


                    if (target) {

                        target.focus();

                        target.value =
                            keyword;


                        target.dispatchEvent(
                            new Event(
                                "input",
                                {
                                    bubbles:
                                        true
                                }
                            )
                        );


                        target.dispatchEvent(
                            new KeyboardEvent(
                                "keydown",
                                {
                                    key:
                                        "Enter",

                                    bubbles:
                                        true
                                }
                            )
                        );

                    }


                    closeSearch();

                }

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !== "/"
                ) {

                    return;

                }


                const element =
                    document.activeElement;


                if (
                    element &&
                    (
                        element.tagName ===
                        "INPUT" ||

                        element.tagName ===
                        "TEXTAREA"
                    )
                ) {

                    return;

                }


                event.preventDefault();

                openSearch();

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !panel.classList.contains(
                        "open"
                    )
                ) {

                    return;

                }


                if (
                    panel.contains(
                        event.target
                    ) ||

                    button.contains(
                        event.target
                    )
                ) {

                    return;

                }


                closeSearch();

            }
        );

    }


    /* =====================================================
       Refresh
       ===================================================== */

    function initRefresh() {

        const button =
            $("openlist-refresh-button");


        if (!button) {

            return;

        }


        button.addEventListener(
            "click",
            function () {

                button.style.transform =
                    "rotate(180deg)";


                setTimeout(
                    function () {

                        location.reload();

                    },
                    180
                );

            }
        );

    }


    /* =====================================================
       Theme Transition
       ===================================================== */

    function playThemeTransition(
        x,
        y,
        apply
    ) {

        const reduced =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

        if (reduced) {

            apply();

            return;

        }


        if (
            document.startViewTransition
        ) {

            const beforeDark =
                document.body.classList.contains(
                    "hope-ui-dark"
                );

            const transition =
                document.startViewTransition(
                    function () {

                        apply();

                        return new Promise(
                            function (resolve) {

                                const obs =
                                    new MutationObserver(
                                        function () {

                                            if (
                                                document.body.classList.contains(
                                                    "hope-ui-dark"
                                                ) !== beforeDark
                                            ) {

                                                obs.disconnect();

                                                resolve();

                                            }

                                        }
                                    );

                                obs.observe(
                                    document.body,
                                    {
                                        attributes: true,

                                        attributeFilter:
                                            [
                                                "class"
                                            ]
                                    }
                                );

                                setTimeout(
                                    function () {

                                        obs.disconnect();

                                        resolve();

                                    },
                                    350
                                );

                            }
                        );

                    }
                );

            transition.ready
                .then(function () {

                    const r =
                        Math.ceil(
                            Math.hypot(
                                Math.max(
                                    x,
                                    window.innerWidth - x
                                ),

                                Math.max(
                                    y,
                                    window.innerHeight - y
                                )
                            ) * 1.05
                        );

                    document.documentElement.animate(
                        [
                            {
                                clipPath:
                                    "circle(0px at " + x + "px " + y + "px)",

                                transform: "scale(1.16)",

                                filter:
                                    "brightness(1.7) saturate(1.6)",

                                easing:
                                    "cubic-bezier(0.6, 0, 0.9, 0.4)"
                            },

                            {
                                clipPath:
                                    "circle(" +
                                    Math.round(r * 0.24) +
                                    "px at " +
                                    x +
                                    "px " +
                                    y +
                                    "px)",

                                transform: "scale(1.06)",

                                filter:
                                    "brightness(1.3) saturate(1.25)",

                                offset: 0.4,

                                easing:
                                    "cubic-bezier(0.1, 0.7, 0.15, 1)"
                            },

                            {
                                clipPath:
                                    "circle(" + r + "px at " + x + "px " + y + "px)",

                                transform: "scale(1)",

                                filter:
                                    "brightness(1) saturate(1)"
                            }
                        ],
                        {
                            duration: 1000,

                            pseudoElement:
                                "::view-transition-new(root)"
                        }
                    );

                    document.documentElement.animate(
                        [
                            {
                                transform: "scale(1)",

                                filter: "blur(0px)",

                                opacity: 1
                            },

                            {
                                transform: "scale(1.08)",

                                filter: "blur(10px)",

                                opacity: 0.35
                            }
                        ],
                        {
                            duration: 1000,

                            easing:
                                "cubic-bezier(0.5, 0, 0.2, 1)",

                            pseudoElement:
                                "::view-transition-old(root)"
                        }
                    );

                })
                .catch(function () {});

            return;

        }

        fallbackThemeTransition(
            x,
            y,
            apply
        );

    }


    function buildThemeFx(x, y, toDark) {

        const old =
            document.getElementById(
                "openlist-theme-fx"
            );

        if (old) {

            old.remove();

        }

        const size =
            Math.ceil(
                Math.hypot(
                    Math.max(
                        x,
                        window.innerWidth - x
                    ),

                    Math.max(
                        y,
                        window.innerHeight - y
                    )
                ) * 2.6
            );

        const geo =
            "left:" + x + "px;" +
            "top:" + y + "px;" +
            "width:" + size + "px;" +
            "height:" + size + "px;";

        const fx =
            document.createElement("div");

        fx.id = "openlist-theme-fx";

        fx.className = toDark
            ? "to-dark"
            : "to-light";

        fx.style.setProperty(
            "--fx-x",
            x + "px"
        );

        fx.style.setProperty(
            "--fx-y",
            y + "px"
        );

        fx.innerHTML =
            '<div class="fx-core" style="' + geo + '"></div>' +
            '<div class="fx-ring fx-ring-1" style="' + geo + '"></div>' +
            '<div class="fx-ring fx-ring-2" style="' + geo + '"></div>' +
            '<div class="fx-ring fx-ring-3" style="' + geo + '"></div>' +
            '<div class="fx-flash"></div>';

        document.body.appendChild(fx);

        return fx;

    }


    function fallbackThemeTransition(x, y, apply) {

        const toDark =
            !document.body.classList.contains(
                "hope-ui-dark"
            );

        const fx =
            buildThemeFx(x, y, toDark);

        const root =
            document.documentElement;

        root.classList.add(
            "openlist-theme-warp"
        );

        requestAnimationFrame(function () {

            fx.classList.add("run");

        });

        setTimeout(apply, 430);

        setTimeout(function () {

            fx.classList.add("reveal");

            root.classList.remove(
                "openlist-theme-warp"
            );

        }, 530);

        setTimeout(function () {

            fx.remove();

        }, 1500);

    }


    /* =====================================================
       Theme
       ===================================================== */

    function initTheme() {

        const button =
            $("openlist-theme-button");


        const footer =
            $("openlist-footer-theme");


        function apply() {

            const buttons =
                document.querySelectorAll(
                    "button"
                );


            for (
                let i = 0;
                i < buttons.length;
                i++
            ) {

                const candidate =
                    buttons[i];


                if (
                    candidate ===
                    button ||

                    candidate ===
                    footer
                ) {

                    continue;

                }


                const label =
                    (
                        candidate
                            .getAttribute(
                                "aria-label"
                            ) ||

                        candidate
                            .getAttribute(
                                "title"
                            ) ||

                        candidate
                            .innerText ||

                        ""
                    ).toLowerCase();


                if (

                    label.includes(
                        "theme"
                    ) ||

                    label.includes(
                        "dark"
                    ) ||

                    label.includes(
                        "light"
                    ) ||

                    label.includes(
                        "\u4E3B\u9898"
                    )
                ) {

                    candidate.click();

                    return;

                }

            }


            const dark =
                document.body.classList.contains(
                    "hope-ui-dark"
                );


            if (dark) {

                document.body.classList.remove(
                    "hope-ui-dark"
                );

                document.body.classList.add(
                    "hope-ui-light"
                );

            } else {

                document.body.classList.remove(
                    "hope-ui-light"
                );

                document.body.classList.add(
                    "hope-ui-dark"
                );

            }

        }


        function toggle(event) {

            const x =
                event && event.clientX
                    ? event.clientX
                    : window.innerWidth / 2;

            const y =
                event && event.clientY
                    ? event.clientY
                    : window.innerHeight / 2;

            playThemeTransition(
                x,
                y,
                apply
            );

        }


        if (button) {

            button.addEventListener(
                "click",
                toggle
            );
        }


        if (footer) {

            footer.addEventListener(
                "click",
                toggle
            );
        }

    }


    /* =====================================================
       More
       ===================================================== */

    function initMore() {

        const button = $("openlist-more-button");

        if (!button) {
            return;
        }

        let menu = $("openlist-more-menu");

        if (menu) {
            return;
        }

        const protocol = window.location.protocol;
        const hostname = window.location.hostname;

        const baseUrl =
            protocol + "//" + hostname;

        const manageUrl =
            baseUrl + ":5244/@manage";

        menu = document.createElement("div");

        menu.id = "openlist-more-menu";

        menu.innerHTML = `

            <div
                class="openlist-more-title"
            >
                \u5FEB\u6377\u5165\u53E3
            </div>

            <a
                class="openlist-more-item"
                href="${manageUrl}"
            >
                <span class="openlist-more-icon">
                    \u2699
                </span>

                <span class="openlist-more-text">
                    <strong>\u7BA1\u7406\u540E\u53F0</strong>
                    <small>OpenList \u7BA1\u7406\u4E2D\u5FC3</small>
                </span>

                <span class="openlist-more-arrow">
                    \u203A
                </span>
            </a>

        `;

        document.body.appendChild(menu);


        button.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();

                const isOpen =
                    menu.classList.contains(
                        "open"
                    );

                document
                    .querySelectorAll(
                        "#openlist-more-menu.open"
                    )
                    .forEach(
                        function (item) {

                            item.classList.remove(
                                "open"
                            );

                        }
                    );

                if (!isOpen) {

                    const rect =
                        button.getBoundingClientRect();

                    menu.style.top =
                        (
                            rect.bottom + 10
                        ) + "px";

                    menu.style.right =
                        (
                            window.innerWidth -
                            rect.right
                        ) + "px";

                    menu.classList.add(
                        "open"
                    );

                }

            }
        );


        menu.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

            }
        );


        document.addEventListener(
            "click",
            function () {

                menu.classList.remove(
                    "open"
                );

            }
        );


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    menu.classList.remove(
                        "open"
                    );

                }

            }
        );


        window.addEventListener(
            "resize",
            function () {

                if (
                    !menu.classList.contains(
                        "open"
                    )
                ) {
                    return;
                }

                const rect =
                    button.getBoundingClientRect();

                menu.style.top =
                    (
                        rect.bottom + 10
                    ) + "px";

                menu.style.right =
                    (
                        window.innerWidth -
                        rect.right
                    ) + "px";

            }
        );

    }
        
    /* =====================================================
       Initialize
       ===================================================== */

    function init() {

        initVideo();

        initScroll();

        initTop();

        initSearch();

        initRefresh();

        initTheme();

        initMore();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                setTimeout(
                    init,
                    1000
                );

            }
        );

    } else {

        setTimeout(
            init,
            1000
        );

    }

})();

</script>

<script>

(function () {

    "use strict";


    /* =====================================================
       Skip Login Page
       ===================================================== */

    if (
        location.pathname.indexOf(
            "/@login"
        ) === 0
    ) {

        return;

    }


    /* =====================================================
       Login Status Check
       ===================================================== */

    function isLoggedIn() {

        try {

            if (
                localStorage.getItem(
                    "token"
                )
            ) {

                return true;

            }

            if (
                sessionStorage.getItem(
                    "token"
                )
            ) {

                return true;

            }

        } catch (e) {}

        return false;

    }


    /* === 未登录就弹（不再判断游客模式） === */
    if ( isLoggedIn() ) {

        return;

    }


    /* =====================================================
       Wait for OpenList Main App
       ===================================================== */

    let waited = 0;

    const MAX_WAIT = 15000;

    const CHECK_INTERVAL = 300;


    function waitForApp() {

        waited += CHECK_INTERVAL;

        if (waited > MAX_WAIT) {

            console.warn(
                "[OpenList Login Modal] \u7B49\u5F85\u8D85\u65F6"
            );

            return;

        }


        const modal =
            document.getElementById(
                "openlist-login-modal"
            );


        const appReady =

            document.querySelector(
                "#root .body"
            ) ||

            document.querySelector(
                ".body > .nav"
            ) ||

            document.querySelector(
                ".obj-box"
            ) ||

            document.querySelector(
                ".hope-icon-button"
            );


        if (modal && appReady) {

            initModal(modal);

            return;

        }


        setTimeout(
            waitForApp,
            CHECK_INTERVAL
        );

    }


    /* =====================================================
       Initialize Modal
       ===================================================== */

    function initModal(modal) {

        const form =
            document.getElementById(
                "olm-form"
            );

        const inputUser =
            document.getElementById(
                "olm-username"
            );

        const inputPass =
            document.getElementById(
                "olm-password"
            );

        const submitBtn =
            document.getElementById(
                "olm-submit"
            );

        const guestBtn =
            document.getElementById(
                "olm-guest"
            );

        const errorBox =
            document.getElementById(
                "olm-error"
            );


        if (
            !form ||
            !submitBtn ||
            !guestBtn
        ) {

            return;

        }


        function openModal() {

            modal.classList.add(
                "show"
            );

            document.body.style.overflow =
                "hidden";

            setTimeout(
                function () {

                    if (inputUser) {

                        inputUser.focus();

                    }

                },
                140
            );

        }


        function closeModal() {

            modal.classList.remove(
                "show"
            );

            document.body.style.overflow =
                "";

        }


        function showError(msg) {

            errorBox.textContent =
                msg || "\u767B\u5F55\u5931\u8D25";

            errorBox.classList.add(
                "show"
            );

        }


        function hideError() {

            errorBox.classList.remove(
                "show"
            );

            errorBox.textContent =
                "";

        }


        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                hideError();

                const username =
                    inputUser.value.trim();

                const password =
                    inputPass.value;


                if (
                    !username ||
                    !password
                ) {

                    showError(
                        "\u8BF7\u8F93\u5165\u7528\u6237\u540D\u548C\u5BC6\u7801"
                    );

                    return;

                }


                submitBtn.disabled =
                    true;

                submitBtn.textContent =
                    "\u767B\u5F55\u4E2D...";


                fetch(
                    "/api/auth/login",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                )
                .then(
                    function (res) {

                        return res.json();

                    }
                )
                .then(
                    function (data) {

                        if (
                            data &&
                            data.code === 200 &&
                            data.data &&
                            data.data.token
                        ) {

                            try {

                                localStorage.setItem(
                                    "token",
                                    data.data.token
                                );

                                sessionStorage.removeItem(
                                    "openlist-guest-mode"
                                );

                            } catch (e) {}


                            location.reload();

                            return;

                        }


                        submitBtn.disabled =
                            false;

                        submitBtn.textContent =
                            "\u767B \u5F55";


                        showError(
                            (
                                data &&
                                data.message
                            ) ||
                            "\u7528\u6237\u540D\u6216\u5BC6\u7801\u9519\u8BEF"
                        );

                    }
                )
                .catch(
                    function () {

                        submitBtn.disabled =
                            false;

                        submitBtn.textContent =
                            "\u767B \u5F55";


                        showError(
                            "\u7F51\u7EDC\u9519\u8BEF\uFF0C\u8BF7\u7A0D\u540E\u518D\u8BD5"
                        );

                    }
                );

            }
        );


        function enterGuest() {

            try {

                sessionStorage.setItem(
                    "openlist-guest-mode",
                    "1"
                );

            } catch (e) {}


            closeModal();

        }


        guestBtn.addEventListener(
            "click",
            enterGuest
        );


        const backdrop =
            modal.querySelector(
                ".olm-backdrop"
            );


        if (backdrop) {

            backdrop.addEventListener(
                "click",
                enterGuest
            );

        }


        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    modal.classList.contains(
                        "show"
                    )
                ) {

                    enterGuest();

                }

            }
        );


        window.openlistLogin =
            openModal;


        setTimeout(
            openModal,
            400
        );

    }


    waitForApp();

})();

</script>


<!-- =========================================================
     ▼▼▼ Footer Login / Logout Toggle ▼▼▼
     ========================================================= -->

<script>

(function () {

    "use strict";


    /* =====================================================
       Helpers
       ===================================================== */

    function getBtn() {

        return document.getElementById(
            "openlist-footer-login-btn"
        );

    }


    function isLoggedIn() {

        try {

            return !!(
                localStorage.getItem("token") ||
                sessionStorage.getItem("token")
            );

        } catch (e) {

            return false;

        }

    }


    /* =====================================================
       Update Button Appearance
       ===================================================== */

    function updateButton() {

        const btn = getBtn();

        if (!btn) {
            return;
        }


        const span =
            btn.querySelector("span");


        if (isLoggedIn()) {

            btn.setAttribute(
                "data-action",
                "logout"
            );

            btn.setAttribute(
                "title",
                "\u767B\u51FA"
            );

            if (span) {

                span.innerHTML =
                    "\u767B\u51FA";

            }

        } else {

            btn.setAttribute(
                "data-action",
                "login"
            );

            btn.setAttribute(
                "title",
                "\u767B\u5F55"
            );

            if (span) {

                span.innerHTML =
                    "\u767B\u5F55";

            }

        }

    }


    /* =====================================================
       Click Handler
       ===================================================== */

    function handleClick(event) {

        event.preventDefault();
        event.stopPropagation();


        const btn = getBtn();

        if (!btn) {
            return;
        }


        const action =
            btn.getAttribute(
                "data-action"
            );


        if (action === "logout") {

            try {

                localStorage.removeItem(
                    "token"
                );

                sessionStorage.removeItem(
                    "token"
                );

                sessionStorage.removeItem(
                    "openlist-guest-mode"
                );

            } catch (e) {}


            location.reload();

            return;

        }


        if (
            typeof window.openlistLogin ===
            "function"
        ) {

            try {

                sessionStorage.removeItem(
                    "openlist-guest-mode"
                );

            } catch (e) {}


            window.openlistLogin();

            return;

        }


        location.href =
            "/@login";

    }


    /* =====================================================
       Bind Events
       ===================================================== */

    function bind() {

        const btn = getBtn();

        if (!btn) {
            return;
        }


        if (
            btn.dataset.bound ===
            "1"
        ) {

            return;

        }


        btn.dataset.bound = "1";


        btn.addEventListener(
            "click",
            handleClick
        );

    }


    /* =====================================================
       Init
       ===================================================== */

    function init() {

        updateButton();

        bind();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                setTimeout(
                    init,
                    1200
                );

            }
        );

    } else {

        setTimeout(
            init,
            1200
        );

    }

})();

</script>
